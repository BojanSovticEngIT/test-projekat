spring:
  application:
    name: skill-matrix
  datasource:
    url: jdbc:postgresql://localhost:5432/skillmatrix
    username: skillmatrix
    password: password
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 32MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

app:
  jwt:
    secret: skill-matrix-jwt-secret-placeholder-change-in-prod
    expiration: 86400000

spring.mail:
  host: ${SMTP_HOST:}
  port: ${SMTP_PORT:587}
  username: ${SMTP_USER:}
  password: ${SMTP_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
  from: ${SMTP_FROM:noreply@eng.it}

azure:
  openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT:}
    key: ${AZURE_OPENAI_KEY:}

workday:
  sync:
    enabled: ${WORKDAY_SYNC_ENABLED:false}
  csv:
    path: ${WORKDAY_CSV_PATH:classpath:workday-sample.csv}

server:
  port: 8080
  servlet:
    context-path: /wms/skillmatrix

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
  api-docs:
    path: /v3/api-docs

logging:
  level:
    it.eng.wsm.skillmatrix: DEBUG
    liquibase: INFO
