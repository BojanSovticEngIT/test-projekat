services:
  db:
    image: docker.io/library/postgres:17
    container_name: skill-matrix-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - skill-matrix-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Containerfile
    container_name: skill-matrix-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@eng.it}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY:-}
      WORKDAY_SYNC_ENABLED: ${WORKDAY_SYNC_ENABLED:-false}
      WORKDAY_CSV_PATH: ${WORKDAY_CSV_PATH:-classpath:workday-sample.csv}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: Containerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/wms/skillmatrix
    container_name: skill-matrix-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  skill-matrix-db-data:

